name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Test and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KAPU_STORE_BASE64: ${{ secrets.KAPU_STORE_BASE64 }}
          KAPU_STORE_PASSWORD: ${{ secrets.KAPU_STORE_PASSWORD }}
          KAPU_KEY_ALIAS: ${{ secrets.KAPU_KEY_ALIAS }}
          KAPU_KEY_PASSWORD: ${{ secrets.KAPU_KEY_PASSWORD }}
        run: |
          echo "$KAPU_STORE_BASE64" | base64 -d > release.jks
          KAPU_STORE_FILE=release.jks ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "kapu-${GITHUB_REF_NAME}.apk"
          sha256sum "kapu-${GITHUB_REF_NAME}.apk" > "kapu-${GITHUB_REF_NAME}.apk.sha256"
          rm release.jks

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" kapu-*.apk kapu-*.apk.sha256 --generate-notes
