name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Actions are pinned to commit SHAs because the release job handles the signing key.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Test and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    # Secrets live in a protected environment, used only by this tag-only job.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Signed release APK
        env:
          FEEDCUT_STORE_BASE64: ${{ secrets.FEEDCUT_STORE_BASE64 }}
          FEEDCUT_STORE_PASSWORD: ${{ secrets.FEEDCUT_STORE_PASSWORD }}
          FEEDCUT_KEY_ALIAS: ${{ secrets.FEEDCUT_KEY_ALIAS }}
          FEEDCUT_KEY_PASSWORD: ${{ secrets.FEEDCUT_KEY_PASSWORD }}
        run: |
          echo "$FEEDCUT_STORE_BASE64" | base64 -d > release.jks
          FEEDCUT_STORE_FILE=release.jks ./gradlew --no-daemon :app:assembleRelease
          rm release.jks
          cp app/build/outputs/apk/release/app-release.apk "feedcut-${GITHUB_REF_NAME}.apk"
          sha256sum "feedcut-${GITHUB_REF_NAME}.apk" > "feedcut-${GITHUB_REF_NAME}.apk.sha256"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" feedcut-*.apk feedcut-*.apk.sha256 --generate-notes
